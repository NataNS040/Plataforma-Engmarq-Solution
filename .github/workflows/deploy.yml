name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      public_signup:
        description: 'Open signup UI only after separately approved database/Auth activation'
        type: boolean
        default: false
      captcha_required:
        description: 'Require configured CAPTCHA token (coordinate with Supabase Auth)'
        type: boolean
        default: false
      user_invitations:
        description: 'Expose invitations only after separately approved backend activation'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-test-anon-key

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: https://api.norveo.com.br/api/v1
          VITE_BASE_PATH: /
          VITE_PUBLIC_SIGNUP_ENABLED: ${{ inputs.public_signup && 'true' || 'false' }}
          VITE_AUTH_CAPTCHA_REQUIRED: ${{ inputs.captcha_required && 'true' || 'false' }}
          VITE_TURNSTILE_SITE_KEY: ${{ inputs.captcha_required && '0x4AAAAAAFWHLDhOoEvRZg7I' || '' }}
          VITE_USER_INVITATIONS_ENABLED: ${{ inputs.user_invitations && 'true' || 'false' }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          cname: norveo.com.br
