[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engmarq-backend"
version = "0.1.0"
description = "API da Plataforma EngMarq"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "supabase>=2.31,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
