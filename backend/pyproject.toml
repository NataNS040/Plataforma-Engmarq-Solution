[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engmarq-backend"
version = "0.1.0"
description = "API da Plataforma EngMarq"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "supabase==2.31.0",
    "httpx==0.28.1",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
