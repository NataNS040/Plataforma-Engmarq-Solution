name: engmarq

services:
  api:
    build:
      context: ./backend
    image: ${API_IMAGE:-engmarq-api:public-signup-candidate}
    restart: unless-stopped
    env_file:
      - path: ${BACKEND_ENV_FILE:-/etc/engmarq/backend.env}
        format: raw
    environment:
      # Only Caddy may supply trusted forwarded HTTPS/client-address headers.
      FORWARDED_ALLOW_IPS: 172.30.25.2
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert r.status == 200 and json.load(r)['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      proxy:
        ipv4_address: 172.30.25.3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: 172.30.25.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.25.0/24

volumes:
  caddy_data:
  caddy_config:
