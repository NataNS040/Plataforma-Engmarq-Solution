<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- mantido em sincronia manual com src/config/brand.ts -->
    <title>Norveo — O Norte da sua Gestão</title>
    <script>
      // SPA redirect restore: reads the path encoded by 404.html and
      // replaces the history state so React Router sees the correct URL.
      (function () {
        var base = '/Plataforma-Engmarq-Solution/';
        var path = new URLSearchParams(location.search).get('__spa');
        if (path !== null) {
          var target = new URL(base + path, location.origin);
          target.hash = location.hash;
          if (target.origin === location.origin && target.pathname.startsWith(base)) {
            history.replaceState(null, '', target.pathname + target.search + target.hash);
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
