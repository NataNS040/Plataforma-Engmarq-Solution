<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Norveo</title>
    <script>
      (function () {
        var base = '/Plataforma-Engmarq-Solution/';
        var l = window.location;
        if (!l.pathname.startsWith(base) || l.pathname === base) return;
        var target = new URL(base, l.origin);
        target.searchParams.set('__spa', l.pathname.slice(base.length) + l.search);
        // Keep fragments (including Auth tokens) out of the HTTP query string.
        target.hash = l.hash;
        l.replace(target.href);
      })();
    </script>
  </head>
  <body></body>
</html>
